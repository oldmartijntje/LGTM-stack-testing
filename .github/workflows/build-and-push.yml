name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'handler/**'
      - '.github/workflows/build-and-push.yml'

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/mqtt-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/mqtt-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-handler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Handler
        uses: docker/build-push-action@v5
        with:
          context: ./handler
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/mqtt-handler:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/mqtt-handler:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
